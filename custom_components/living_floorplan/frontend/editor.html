<!-- Living Floor Plan - editor -->
<!doctype html>
<!-- Floor plan editor (walls, shapes, openings, rooms, devices). Plain HTML + ES modules, no build:
     serve the repository root and open /editor/ - or tools/serve.mjs for saving with versions
     on the server - (?model=<url> opens a model,
     ?lang=en|pl picks the language). Texts: i18n.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floor plan editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22#131a24%22/%3E%3Cg transform=%22translate%285 5%29 scale%28.84375%29%22%3E%3Crect x=%2210%22 y=%2210%22 width=%2222%22 height=%2213%22 fill=%22#ffb340%22/%3E%3Cpolygon points=%2220,24 32,24 54,40 54,54 38,54%22 fill=%22#ffc300%22/%3E%3Cpath d=%22M6 6H36V26H58V58H6Z%22 fill=%22none%22 stroke=%22#e6ebf2%22 stroke-width=%228%22/%3E%3Cpath d=%22M6 26H20M32 26H36%22 stroke=%22#e6ebf2%22 stroke-width=%226%22/%3E%3C/g%3E%3C/svg%3E">
<style>
/* Floor plan editor - the colour palette of the generated plan. */
:root {
  --bg: #131a24; --panel: #1b2433; --line: #2a3547; --text: #c3cfdf; --muted: #7c8ca3;
  --accent: #5fd6e8; --warn: #e57373; --sel: #ffab40;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, sans-serif; }
body { display: grid; grid-template-rows: auto 1fr auto; }
#bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 10px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
.grp { display: flex; gap: 4px; align-items: center; }
button, select, input { font: inherit; color: var(--text); background: #232e40;
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: 0.4; cursor: default; }
button.on { background: #2c4a5a; border-color: var(--accent); color: #fff; }
input[type=number] { width: 70px; }
label { display: flex; gap: 5px; align-items: center; color: var(--muted); }
main { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 0; overflow: hidden; } /* the panel sliding in: no scroll bar for a moment */
main.has-sel { grid-template-columns: 256px minmax(0, 1fr) 280px; }
#tools, #panel { scrollbar-color: #2a3547 #1b2433; scrollbar-width: thin; }
/* tools on the left: a click opens a tool and its options below it */
#tools { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
.tool { border: 1px solid transparent; border-radius: 8px; margin-bottom: 4px; }
.tool.on { border-color: var(--line); background: #1f2a3b; }
.tool-h { width: 100%; display: flex; justify-content: space-between; align-items: center; text-align: left;
  background: transparent; border-color: transparent; padding: 7px 10px; font-weight: 500; }
.tool-h kbd { color: var(--muted); font: 11px system-ui, sans-serif; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.tool.on > .tool-h { color: #fff; border-color: transparent; background: #2c4a5a; }
.tool-body { display: none; padding: 8px 8px 10px; }
.tool.on > .tool-body { display: block; }
.tool.on.folded > .tool-body { display: none; }
#tools .row { display: grid; grid-template-columns: 74px 1fr; gap: 6px; align-items: center; margin: 5px 0; }
#tools .row span { color: var(--muted); }
#tools .row input, #tools .row select { width: 100%; }
#tools .empty { color: var(--muted); margin-top: 8px; font-size: 12px; }
#tools .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
#tools .palette button { font-size: 12px; padding: 4px 6px; text-align: left; }
#tools .pal-h { color: var(--muted); font-size: 11px; margin: 8px 0 3px; text-transform: uppercase; letter-spacing: 0.04em; }
#tools .tool-body > button { margin: 6px 6px 0 0; }
#stage { position: relative; overflow: hidden; background: var(--bg); touch-action: none;
  user-select: none; -webkit-user-select: none; } /* dragging must not select the labels' text */
#stage > svg, #plan { position: absolute; inset: 0; width: 100%; height: 100%; }
#plan svg { width: 100%; height: 100%; display: block; }
#plan { pointer-events: none; }
#plan #sheet { display: none; }
/* a temperature sensor with its readings on the plan: in the editor still its symbol (the readings are empty here) */
#plan .climate-icon.alt { display: inline; }
#plan #room-climate text { display: none; }
/* the readings of a temperature / humidity sensor: "—" until live values come, coloured as on the card */
#plan #room-climate text { fill: var(--text); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
#plan #room-climate .climate-hum, #plan #room-climate .climate-name { fill: var(--muted); }
#overlay { cursor: default; }
#stage.tool-wall #overlay { cursor: crosshair; }
#stage.panning #overlay { cursor: grabbing; }
#len-box { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 12px; }
#len-box b { color: #fff; font-size: 16px; min-width: 3ch; display: inline-block; text-align: right; }
#len-box small { color: var(--muted); margin-left: 8px; }
/* the right panel: a column only while something is selected, sliding in (the plan stays where it was) */
#panel { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 4px 12px 12px; display: none; }
main.has-sel #panel { display: block; animation: panel-in 0.18s ease; }
@keyframes panel-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
#panel h3 { font-size: 13px; margin: 14px 0 6px; color: #fff; }
#panel h3 small { color: var(--muted); font-weight: normal; }
#panel ul { padding-left: 16px; margin: 0; color: var(--muted); }
#panel li { margin-bottom: 4px; }
#panel .row { display: grid; grid-template-columns: 90px 1fr; gap: 6px; align-items: center; margin: 5px 0; }
#panel .row span { color: var(--muted); }
#panel .row input, #panel .row select { width: 100%; }
#panel .empty { color: var(--muted); margin-top: 14px; }
#panel .danger { color: var(--warn); border-color: #5a3434; margin-top: 8px; }
/* fixed height: text appearing on the first mouse move must not resize the stage
   (the plan jumped by half the line under the cursor) */
#status { display: flex; gap: 18px; padding: 0 10px; height: 26px; align-items: center; white-space: nowrap; overflow: hidden; background: var(--panel);
  border-top: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
#st-msg { color: var(--accent); }
/* overlay */
.ov-wall-hit { fill: none; }
.ov-sel { fill: none; stroke: var(--sel); stroke-width: 2; vector-effect: non-scaling-stroke; }
.ov-hover { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-dasharray: 4 3; }
.ov-node { fill: var(--bg); stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.ov-node.sel { stroke: var(--sel); }
/* the round turn handle of the selected item */
.ov-rot-line { stroke: var(--sel); stroke-width: 1; stroke-dasharray: 3 2; vector-effect: non-scaling-stroke; pointer-events: none; }
.ov-rot { cursor: grab; }
.ov-rot-bg { fill: var(--panel); stroke: var(--sel); stroke-width: 1.5; }
.ov-rot-arrow { fill: none; stroke: var(--sel); stroke-width: 1.6; stroke-linecap: round; }
.ov-rot-head { fill: var(--sel); }
/* a circuit's bulbs, one row each: number (select), direction, beam angle, out of the circuit, remove */
.bulb-list { display: flex; flex-direction: column; gap: 4px; }
.bulb-row { display: flex; align-items: center; gap: 4px; }
.bulb-row.on > button[data-bsel] { border-color: var(--sel); color: var(--sel); }
.bulb-row label { display: flex; align-items: center; gap: 2px; color: var(--muted); }
.bulb-row input { width: 4.2em; min-width: 0; padding-left: 4px; padding-right: 2px; }
.bulb-row button { min-width: 26px; padding: 2px 6px; }
.pane-list { display: flex; flex-direction: column; gap: 6px; }
.pane-row { display: flex; flex-direction: column; gap: 3px; }
.pane-row > input { margin-left: 1.8em; width: calc(100% - 1.8em); }
.bulb-row .pane-n { width: 1.4em; text-align: center; }
.bulb-row .pane-rest { width: 4.2em; padding-left: 4px; }
.bulb-row select { min-width: 0; flex: 1; }
.ov-snap { fill: none; stroke: #fff; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.ov-preview { fill: rgba(95, 214, 232, 0.35); stroke: var(--accent); stroke-width: 1; vector-effect: non-scaling-stroke; }
.ov-preview.walls { stroke: none; fill: rgba(95, 214, 232, 0.45); } /* no seams at the joints */
.ov-preview.bad { fill: rgba(229, 115, 115, 0.35); stroke: var(--warn); }
#panel > section > button { margin: 6px 6px 0 0; }
.ov-room { fill: #fff; font-family: system-ui, sans-serif; font-weight: 600; text-anchor: middle; dominant-baseline: middle;
  paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.ov-room.area { fill: var(--muted); font-weight: normal; }
.ov-room.sel { fill: var(--sel); }
.ov-room-hover { fill: rgba(95, 214, 232, 0.12); stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.ov-room-sel { fill: rgba(255, 171, 64, 0.10); stroke: var(--sel); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.ov-divider { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
.ov-divider.sel { stroke: var(--sel); stroke-width: 2.5; }
.ov-device { fill: rgba(124, 140, 163, 0.08); stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.ov-device-name { fill: var(--muted); font-family: system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
#panel .room-row { cursor: pointer; }
#panel .pal-h { color: var(--muted); font-size: 11px; margin: 8px 0 3px; text-transform: uppercase; letter-spacing: 0.04em; }
#panel .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
#panel .palette button { font-size: 12px; padding: 4px 6px; text-align: left; }
#panel .room-row:hover span { color: var(--text); }
.ov-guide { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 2 4; vector-effect: non-scaling-stroke; }
.ov-dim { fill: var(--text); font-family: system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle;
  paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.ov-dim.sel { fill: var(--sel); }
.ov-dim.live { fill: #fff; }
#grid line { vector-effect: non-scaling-stroke; }
/* a phone: the plan first and big; the top bar in one scrolling row; the tools as a row of icons with the open
   tool's options under it; the panel below, scrolling */
@media (max-width: 760px) {
  #bar { flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding: 4px 6px; scrollbar-width: none; }
  #bar .grp { flex: none; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(45vh, 1fr) auto auto; }
  #stage { order: 1; }
  #tools { order: 2; max-height: none; border: 0; border-top: 1px solid var(--line); padding: 4px 6px;
    display: grid; grid-auto-flow: column; grid-template-rows: auto auto; justify-content: start; gap: 4px;
    overflow-x: auto; overflow-y: hidden; }
  .tool { display: contents; }
  .tool-h { grid-row: 1; width: auto; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; white-space: nowrap; }
  .tool-h kbd { display: none; }
  .tool-h .ico { margin-right: 4px; }
  .tool.on > .tool-h { border-color: var(--accent); }
  .tool-body { grid-row: 2; grid-column: 1 / span 12; position: sticky; left: 0; width: calc(100vw - 12px); min-width: 0;
    max-height: 32vh; overflow-y: auto; border-top: 1px solid var(--line); }
  #panel { order: 3; max-height: 30vh; border: 0; border-top: 1px solid var(--line); }
  main.has-sel { grid-template-columns: minmax(0, 1fr); }
  .versions { min-width: 0; }
  dialog { max-width: calc(100vw - 24px); }
  dialog label { grid-template-columns: 90px 1fr; }
}

/* underlay image (calibrated, editor only) */
#underlay { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; max-width: none; }
#stage.has-underlay #plan #rooms { opacity: 0.35; }
#stage.tool-calibrate #overlay { cursor: crosshair; }
/* Home Assistant */
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
dialog label { display: grid; grid-template-columns: 110px 1fr; margin: 8px 0; }
dialog .note { color: var(--muted); max-width: 440px; font-size: 12px; }
input.bad { border-color: var(--warn); color: var(--warn); }
#b-ha.on { border-color: #7ddba0; }

/* live measurements while dragging */
.ov-measure { stroke: #ffab40; stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.ov-measure.end { stroke-dasharray: none; }
.ov-chain { stroke: #7c8ca3; stroke-width: 1; vector-effect: non-scaling-stroke; }
.ov-chain.ext { stroke-opacity: 0.5; }
.ov-chain.sel { stroke: var(--sel); }
.ov-dim.chain { fill: #9aa9bd; }

/* tiles: an icon with a caption instead of drop-down lists */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 4px; margin: 4px 0 6px; }
.tiles.small { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); }
.tile { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 3px 5px; min-height: 58px;
  background: #1d2738; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); cursor: pointer; }
.tile:hover { border-color: var(--muted); color: var(--text); }
.tile.on { border-color: var(--accent); background: #233a48; color: #fff; }
.tile .ico { width: 26px; height: 26px; flex: none; }
.tiles.small .tile { min-height: 50px; }
.tiles.small .tile .ico { width: 22px; height: 22px; }
.tile span { font-size: 10.5px; line-height: 1.15; text-align: center; hyphens: auto; -webkit-hyphens: auto;
  overflow-wrap: break-word; max-width: 100%; }
.tool-h .ico { width: 18px; height: 18px; margin-right: 8px; flex: none; }
.tool-h { justify-content: flex-start; }
.tool-h kbd { margin-left: auto; }
.sub-h { color: var(--muted); font-size: 11px; margin: 8px 0 2px; text-transform: uppercase; letter-spacing: 0.04em; }
/* foldable groups of the device palette */
#tools .pal-h.fold { display: flex; width: 100%; align-items: center; gap: 6px; background: transparent; border: 0;
  padding: 4px 0; cursor: pointer; font: inherit; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
#tools .pal-h.fold::before { content: "▸"; font-size: 10px; width: 10px; }
#tools .pal-h.fold.open::before { content: "▾"; }
#tools .pal-h.fold span { margin-left: auto; opacity: 0.7; }
#tools .pal-h.fold:hover { color: var(--text, #c3cfdf); }
.turn { display: flex; gap: 6px; }
.turn button { flex: 1; }
.ov-beam { fill: rgba(255, 195, 0, 0.08); stroke: #ffc300; stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; pointer-events: none; }
/* saving with versions */
.ver { color: var(--muted); font-size: 12px; align-self: center; white-space: nowrap; }
.ver.dirty { color: var(--warn, #ffab40); }
#save-dialog h4 { margin: 14px 0 6px; color: var(--muted); font-weight: 500; }
.versions { max-height: 240px; overflow: auto; min-width: 440px; }
.versions .vrow { display: grid; grid-template-columns: 44px 130px 1fr auto; gap: 8px; align-items: center; padding: 3px 0;
  border-top: 1px solid var(--line); font-size: 12px; }
.versions .vrow.cur b { color: var(--accent); }
.versions .vrow span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* the four margins on a line of their own under their label (in a narrow panel they showed no digits) */
.row:has(> .margins) { flex-wrap: wrap; }
.margins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; }
.margins input { width: 100%; min-width: 0; padding: 4px 2px; text-align: center; -moz-appearance: textfield; }
.margins input::-webkit-outer-spin-button, .margins input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
#panel textarea { width: 100%; box-sizing: border-box; background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; font: 12px system-ui, sans-serif; padding: 5px; resize: vertical; }
.ov-below { fill: rgba(142, 161, 186, 0.10); stroke: rgba(142, 161, 186, 0.35); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; pointer-events: none; }
#floor { max-width: 130px; }

/* colour swatches (floors, furniture) */
.swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.swatches .sw { width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 2px solid transparent; outline: 1px solid #44546f; cursor: pointer; }
.swatches .sw.sel { border-color: #ffc300; }
.swatches .sw.none { background: repeating-linear-gradient(45deg, #2c3a4d 0 4px, #1b2433 4px 8px); }
.swatches input[type="color"] { width: 26px; height: 22px; padding: 0; border: 1px solid #44546f; border-radius: 6px; background: none; cursor: pointer; }

/* drawing a piece of furniture */
.sketch { border: 1px solid #2a3547; border-radius: 8px; padding: 6px; margin: 4px 0 8px; }
.sketch label { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
.ov-sketch { fill: rgba(36, 48, 64, 0.85); stroke: #8ea1ba; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.ov-sketch.detail { fill: rgba(44, 58, 77, 0.95); stroke: #44546f; }
.ov-sketch.live { fill: rgba(255, 195, 0, 0.08); stroke: #ffc300; stroke-dasharray: 4 3; }
polyline.ov-sketch.live { fill: none; }

/* marker icons: emoji tiles */
.tile.emo .ico { font-size: 18px; line-height: 24px; height: 24px; display: inline-block; }

/* the house wizard */
#wizard { width: min(460px, calc(100vw - 24px)); box-sizing: border-box; }
#wizard h3 { margin: 0 0 6px; }
#wizard .nums { display: grid; gap: 6px; margin: 10px 0; }
#wizard .nums label { display: grid; grid-template-columns: 150px auto; align-items: center; gap: 8px; }
#wizard .nums label > span:first-child { color: var(--muted); }
#wizard input[type=number] { width: 80px; }
#wizard .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 10px 0; }
#wizard .checks label { display: flex; align-items: center; gap: 8px; }
#wizard #wz-out { min-height: 2.6em; line-height: 1.4; }
#wizard #wz-out .warn { color: var(--warn); }
#wizard .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
@media (max-width: 480px) { #wizard .checks { grid-template-columns: 1fr; } #wizard .nums label { grid-template-columns: 1fr auto; } }

/* a piece flush against a wall */
.ov-flush { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; vector-effect: non-scaling-stroke; }

/* the editor build, at the right of the status bar */
#st-build { margin-left: auto; color: var(--muted); font-size: 11px; }

/* the piece in hand (Furniture tool) */
.ov-guide { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.8; vector-effect: non-scaling-stroke; pointer-events: none; }
.ov-ghost { fill: rgba(95, 214, 232, 0.18); stroke: var(--accent); stroke-width: 1.2; vector-effect: non-scaling-stroke; pointer-events: none; }
.ov-ghost * { vector-effect: non-scaling-stroke; }

/* the device in hand (Devices tool): drawn where a click puts it, see-through */
#plan .ghost { opacity: 0.55; }

/* a rack's contents in its panel: the kind's icon, its entity, take out, remove */
.rack-row input { flex: 1; width: auto; }
.rack-row .ico { width: 18px; height: 18px; }

/* the demo's "See it live" */
#bar button.accent { background: #ffc300; color: #131a24; border-color: #ffc300; font-weight: 600; }

</style>
</head>
<body>
<header id="bar">
  <div class="grp">
    <button id="b-new" data-i18n="new" data-i18n-title="new_t"></button>
    <button id="b-wizard" data-i18n="wizard" data-i18n-title="wizard_t"></button>
    <button id="b-open" data-i18n="open" data-i18n-title="open_t"></button>
    <button id="b-save" data-i18n="save" data-i18n-title="save_t"></button>
    <button id="b-preview" data-i18n="preview" data-i18n-title="preview_t"></button>
    <select id="s-export" data-i18n-title="export_t">
      <option value="" data-i18n="export"></option><option value="png" data-i18n="ex_png"></option><option value="png-light" data-i18n="ex_png_light"></option>
      <option value="pdf-a4" data-i18n="ex_pdf_a4"></option><option value="pdf-a3" data-i18n="ex_pdf_a3"></option>
    </select>
    <button id="b-publish" hidden data-i18n="publish" data-i18n-title="publish_t"></button>
    <span id="ver" class="ver"></span>
    <button id="b-example" data-i18n="example" data-i18n-title="example_t"></button>
    <input id="f-open" type="file" accept=".json,application/json" hidden>
  </div>
  <div class="grp">
    <select id="floor" data-i18n-title="floor_t"></select>
    <button id="b-floor-add" data-i18n-title="floor_add_t">＋</button>
    <button id="b-floor-edit" data-i18n-title="floor_edit_t">✎</button>
    <button id="b-floor-below" data-i18n-title="floor_below_t">▤</button>
  </div>
  <div class="grp">
    <button id="b-undo" data-i18n-title="undo_t">↶</button>
    <button id="b-redo" data-i18n-title="redo_t">↷</button>

    L.push(`      <line class="sky-bar" x1="${n4(v ? x : x + w / 2)}" y1="${n4(v ? y + h / 2 : y)}" x2="${n4(v ? x + w : x + w / 2)}" y2="${n4(v ? y + h / 2 : y + h)}"/>`);
  } else if (d.type === "icon") {
    const [x, y] = d.at;
    const pool = ALARM_KINDS.includes(d.kind) ? "alarm-pool" : N.appliancePool;
    L.push(`      <g class="glows"${clipAttr2(clip)}>`);
    L.push(`        <circle class="glow ${N.deviceGlow}" cx="${n4(x)}" cy="${n4(y)}" r="${n4(d.glow_r || 40)}" fill="url(#${pool})" stroke="none"/>`);
    L.push(`      </g>`);
    if (!d.hit) {
      L.push(`      <circle class="${N.iconBadge}" cx="${n4(x)}" cy="${n4(y)}" r="7.5"/>`);
      L.push(`      <g transform="translate(${n4(x)} ${n4(y)}) rotate(${n4(upright)}) scale(0.95)"><use class="${N.iconGlyph}" href="#icon-${d.kind}"/></g>`);
    }
    if (valueEntity) L.push(`      <text class="${N.deviceValue}" x="${n4(x)}" y="${n4(y + 12)}" transform="rotate(${n4(upright)} ${n4(x)} ${n4(y)})">\u2014</text>`);
  } else if (d.type === "presence") {
    const [x, y] = d.at;
    fan();
    L.push(`      <g${clipAttr2(clip)}>`);
    for (const f of [N.wave, N.wave + " f2", N.wave + " f3"]) L.push(`        <circle class="${f}" cx="${n4(x)}" cy="${n4(y)}" r="26"/>`);
    L.push(`      </g>`);
    L.push(`      <circle class="${N.sensorBody}" cx="${n4(x)}" cy="${n4(y)}" r="3.4" fill="none"/>`);
    L.push(`      <circle class="${N.sensorBody}" cx="${n4(x)}" cy="${n4(y)}" r="1.2"/>`);
  } else {
    const gl = d.glow;
    const [x, y] = gl.at;
    const shape = (cls2, fill) => gl.r ? `<circle class="${cls2}" cx="${n4(x)}" cy="${n4(y)}" r="${n4(gl.r)}" fill="url(#${fill})" stroke="none"/>` : `<ellipse class="${cls2}" cx="${n4(x)}" cy="${n4(y)}" rx="${n4(gl.rx)}" ry="${n4(gl.ry)}" fill="url(#${fill})" stroke="none"/>`;
    const inner = [];
    if (d.type === "appliance") inner.push(shape("glow " + N.applianceGlow, d.alert ? "alarm-pool" : N.appliancePool));
    if (d.type === "tv") inner.push(shape("glow tv-glow", "tv-pool"));
    if (d.type === "climate_unit") {
      inner.push(shape(`glow ${N.acGlow} ${N.acCool}`, N.acCoolPool), shape(`glow ${N.acGlow} ${N.acHeat}`, N.acHeatPool));
    }
    L.push(`      <g class="glows"${clipAttr2(clip)}>`);
    if (d.clip) L.push(`        <g clip-path="url(#clip-${d.clip})">`);
    for (const s of inner) L.push((d.clip ? "          " : "        ") + s);
    if (d.clip) L.push(`        </g>`);
    L.push(`      </g>`);
    if (d.icon === "snowflake") L.push(`      <path class="${N.snowflake}" d="${snowflake(x, y)}"/>`);

}
function snowflake(cx, cy) {
  const d = [];
  for (let k = 0; k < 6; k++) {
    const a = (-90 - 60 * k) * Math.PI / 180;
    const ux = Math.cos(a), uy = Math.sin(a);
    d.push(`M${n4(cx)} ${n4(cy)} L${n4(cx + 8 * ux)} ${n4(cy + 8 * uy)}`);
    const bx = cx + 4.8 * ux, by = cy + 4.8 * uy;
    for (const s of [1, -1]) {
      const b = a + s * Math.PI / 4;
      d.push(`M${n4(bx)} ${n4(by)} L${n4(bx + 2.6 * Math.cos(b))} ${n4(by + 2.6 * Math.sin(b))}`);
    }
  }
  return d.join(" ");
}
function cover(cv, win, upright = 0) {
  if (!win) throw new Error("cover " + cv.entity + ": unknown window " + cv.window);
  const glass = cv.sash ? win.sashes[cv.sash] : win.line;
  const inward = win.inward || INWARD[win.facade];
  let track = glass;
  if (cv.sash) {
    const depth = (l) => l[0][0] * inward[0] + l[0][1] * inward[1];
    const outer = Object.values(win.sashes).reduce((a2, b2) => depth(b2) < depth(a2) ? b2 : a2);
    const off = depth(outer) - depth(glass);
    track = glass.map(([x, y]) => [x + off * inward[0], y + off * inward[1]]);
  }
  const [a, b] = track;
  const width = len2(track);
  const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const ang = Math.round(Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI);
  const band = [mid[0] - COVER_OUT * inward[0], mid[1] - COVER_OUT * inward[1]];
  const icon2 = [mid[0] + COVER_ICON_IN * inward[0], mid[1] + COVER_ICON_IN * inward[1]];
  const segs = Math.max(1, Math.round(width / COVER_SLAT));
  const slats = [];
  for (let k = 1; k < segs; k++) {
    const x = -width / 2 + k * width / segs;
    slats.push(`          <line class="${N.coverSlat}" x1="${n4(x)}" y1="-3" x2="${n4(x)}" y2="3"/>`);
  }
  const id = "cover-" + win.id + (cv.sash ? "-" + cv.sash : "");
  const [g0, g1] = glass;
  return [
    `    <g id="${id}" data-entity="${esc3(cv.entity)}" class="cover"`,
    `       data-x1="${n4(g0[0])}" data-y1="${n4(g0[1])}" data-x2="${n4(g1[0])}" data-y2="${n4(g1[1])}">`,
    `      <line class="cover-hit"   ${lineXY(track)}/>`,
    `      <g class="${N.coverBand}" transform="translate(${n4(band[0])} ${n4(band[1])}) rotate(${n4(ang)})">`,
    `        <g class="${N.coverBandScale}" transform="scale(1 1)">`,
    `          <rect class="${N.coverFabric}" x="${n4(-width / 2)}" y="-3" width="${n4(width)}" height="6" rx="1"/>`,
    ...slats,
    `        </g>`,
    `      </g>`,
    `      <use class="${N.coverIcon} ${N.coverIconClosed}" href="#${N.coverClosedIcon}" transform="translate(${n4(icon2[0])} ${n4(icon2[1])}) rotate(${n4(ang)})"/>`,
    `      <use class="${N.coverIcon} ${N.coverIconOpen}" href="#${N.coverOpenIcon}" transform="translate(${n4(icon2[0])} ${n4(icon2[1])}) rotate(${n4(ang)})"/>`,
    // while it moves: an arrow instead of the icon, up (opening) or down (closing), upright on the screen
    `      <g class="cover-move" transform="translate(${n4(icon2[0])} ${n4(icon2[1])}) rotate(${n4(upright)})"><path class="cover-move-up" d="M0 -4.2 L4 2.4 H-4 Z"/><path class="cover-move-down" d="M0 4.2 L4 -2.4 H-4 Z"/></g>`,
    `    </g>`
  ].join("\n");
}
function camera(cam) {
  const [x, y] = cam.at;
  const r = cam.range;
  const a0 = (cam.direction - cam.fov / 2) * Math.PI / 180;
  const a1 = (cam.direction + cam.fov / 2) * Math.PI / 180;
  const large = cam.fov > 180 ? 1 : 0;
  const fan = `M${x.toFixed(2)} ${y.toFixed(2)} L${(x + r * Math.cos(a0)).toFixed(2)} ${(y + r * Math.sin(a0)).toFixed(2)} A${r.toFixed(1)} ${r.toFixed(1)} 0 ${large} 1 ${(x + r * Math.cos(a1)).toFixed(2)} ${(y + r * Math.sin(a1)).toFixed(2)} Z`;
  return [
    `    <g${attrs({
      id: cam.id,
      class: N.camera,
      "data-entity-camera": cam.entity,
      "data-off-plan": cam.off_plan ? "true" : void 0,
      [N.attrName]: cam.name,
      "data-entity-camera-2": cam.entity_2,
      "data-entity-camera-hq": cam.entity_hq,
      "data-entity-detect": cam.detect,
      "data-entity-camera-2-hq": cam.entity_2_hq
    })}>`,
    // the fan fades with distance and the camera itself is drawn at its tip - so it does not read as a door swing
    `      <radialGradient id="${esc3(cam.id)}-fade" gradientUnits="userSpaceOnUse" cx="${n4(x)}" cy="${n4(y)}" r="${n4(r)}"><stop offset="0" stop-color="#a99be0" stop-opacity="0.32"/><stop offset="1" stop-color="#a99be0" stop-opacity="0"/></radialGradient>`,
    `      <path class="${N.cameraFan}" d="${fan}" style="fill:url(#${esc3(cam.id)}-fade)"/>`,
    `      <circle class="${N.cameraMark}" cx="${n4(x)}" cy="${n4(y)}" r="5.5"/>`,
    `      <g class="camera-icon" transform="translate(${n4(x)} ${n4(y)}) rotate(${n4(cam.direction)})" pointer-events="none"><rect x="-3.6" y="-2.2" width="5" height="4.4" rx="0.8"/><path d="M1.4 -1.2 L3.8 -2.4 V2.4 L1.4 1.2 Z"/></g>`,
    `      <circle class="${N.cameraHit}" cx="${n4(x)}" cy="${n4(y)}" r="${n4(cam.hit_r || CAMERA_HIT_R)}"/>`,
    `    </g>`
  ].join("\n");
}
function lock(lk, upright) {
  const [x, y] = lk.at;
  return [
    `    <g id="${lk.id}" class="${N.lock}"`,
    `       data-entity="${esc3(lk.entity)}"`,
    `       transform="rotate(${n4(upright)} ${n4(x)} ${n4(y)})">`,
    `      <rect class="${N.lockHit}" x="${n4(x - 11)}" y="${n4(y - 11)}" width="22" height="22"/>`,
    `      <path class="${N.lockClosed}" d="M${n4(x - 3.3)} ${n4(y - 2.5)} v-3.4 a3.3 3.3 0 0 1 6.6 0 v3.4"/>`,
    `      <path class="${N.lockOpen}" d="M${n4(x - 3.3)} ${n4(y - 4.3)} v-3.4 a3.3 3.3 0 0 1 6.6 0 v1.1"/>`,
    `      <rect x="${n4(x - 6)}" y="${n4(y - 2.5)}" width="12" height="9.6" rx="1.6"/>`,
    `      <circle class="${N.lockKeyhole}" cx="${n4(x)}" cy="${n4(y + 2.3)}" r="1.4"/>`,
    `    </g>`
  ].join("\n");
}
