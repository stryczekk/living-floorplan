<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>living-floorplan-card browser test</title>
<style>
  body { background: #131a24; margin: 0; padding: 12px; font-family: sans-serif;
         --primary-text-color: #c3cfdf; --secondary-text-color: #7c8ca3;
         --divider-color: #2a3547; --card-background-color: #1b2433; --primary-color: #03a9f4; }
  #stage > * { display: block; margin-bottom: 12px; }
  #results { color: #c3cfdf; white-space: pre; }
</style>
</head>
<body>
<div id="stage"></div>
<pre id="results">RUNNING</pre>
<script>
  // an error in the test shows up in the results instead of a silent RUNNING
  addEventListener("unhandledrejection", (e) => { document.getElementById("results").textContent = "ERROR  " + ((e.reason && e.reason.stack) || e.reason); });
  addEventListener("error", (e) => { document.getElementById("results").textContent = "ERROR  " + e.message; });
</script>
<script type="module">
// Shots and checks of the card on the example house, with made-up states for
// every entity in the model. Nothing is switched: service calls are recorded.
//   ?shot=night|day|glow|upstairs|phone   one card for a screenshot, no checks
import "../../dist/living-floorplan-card.js";

const P = new URLSearchParams(location.search);
const shot = P.get("shot");
const results = [];
const check = (name, ok, detail = "") => results.push({ name, ok: !!ok, detail: ok ? "" : String(detail) });
const tick = (ms = 50) => new Promise((r) => setTimeout(r, ms));
customElements.define("ha-card", class extends HTMLElement {
  connectedCallback() { this.style.cssText = "display:block;border-radius:12px;border:1px solid #2a3547"; }
});

const MODEL = P.get("model") || "../../examples/house.json";
const model = await (await fetch(MODEL)).json();
// every entity id in the model
const ids = new Set();
(function walk(o) {
  if (typeof o === "string") { if (/^[a-z_]+\.[a-z0-9_]+$/.test(o)) ids.add(o); return; }
  if (o && typeof o === "object") for (const v of Object.values(o)) walk(v);
})(model);

function makeStates(mode) {
  const st = {};
  let i = 0;
  for (const id of ids) {
    const d = id.split(".")[0];
    const s = { entity_id: id, state: "off", attributes: { friendly_name: id.split(".")[1].replace(/_/g, " ") }, last_updated: "t" + mode };
    i++;
    if (d === "light") {
      const on = mode === "night" ? i % 3 !== 0 : mode === "day" ? i % 4 === 0 : mode !== "dark";
      s.state = on ? "on" : "off";
      if (on && i % 5 === 0) s.attributes.brightness = 90;
    } else if (d === "cover") {
      s.state = mode === "night" ? "closed" : "open";
      s.attributes.current_position = mode === "night" ? 0 : i % 3 === 0 ? 40 : 100;
    } else if (id === "sensor.waste_collection") {
      s.state = new Date(Date.now() + 864e5).toISOString().slice(0, 10); s.attributes.device_class = "date"; // tomorrow
    } else if (id === "sensor.washer_state") { s.state = "run";
    } else if (id === "sensor.washer_end") { s.state = new Date(Date.now() + 85 * 60e3 + 20e3).toISOString(); s.attributes.device_class = "timestamp";
    } else if (id === "sensor.dryer_state") { s.state = "stop";
    } else if (id === "sensor.dryer_job") { s.state = "finished";
    } else if (/^sensor\.(washer|dryer)_/.test(id)) { s.state = "none";
    } else if (id === "sensor.dehumidifier_energy") { s.state = "123.4"; Object.assign(s.attributes, { unit_of_measurement: "kWh", device_class: "energy", state_class: "total_increasing" });
    } else if (id === "sensor.solar_power") { s.state = "3240"; s.attributes.unit_of_measurement = "W";
    } else if (id === "sensor.home_battery") { s.state = "78"; s.attributes.unit_of_measurement = "%";
    } else if (d === "sensor") {
      s.state = /hum/.test(id) ? String(40 + (i % 15)) : /temp/.test(id) ? (20 + (i % 5) * 0.6).toFixed(1) : "1";
      s.attributes.unit_of_measurement = /hum/.test(id) ? "%" : "°C";
    } else if (d === "binary_sensor" && /_(smoke|leak|co)$/.test(id)) {
      s.state = "off"; // alarms only where a test turns them on
    } else if (d === "binary_sensor") {
      s.state = /door|contact|window/.test(id) ? (i % 4 === 0 ? "on" : "off") : i % 3 === 0 ? "on" : "off";
    } else if (d === "lock") s.state = "locked";
    else if (d === "weather") { s.state = "partlycloudy"; s.attributes.temperature = 12.6; }
    else if (d === "climate") { s.state = "heat"; s.attributes.hvac_action = "heating"; s.attributes.current_temperature = 21.5; s.attributes.temperature = 22; }
    else if (d === "fan") { s.state = "on"; s.attributes.percentage = 60; }
    else if (d === "media_player") s.state = mode === "night" ? "playing" : "off";
    st[id] = s;
  }
  return st;
}

const calls = [];
let proxy = false;
const proxyCalls = [];
function fakeHass(mode, lang = "en") {
  return { language: lang, locale: { language: lang }, states: makeStates(mode),
    callService: (d, s, data) => calls.push([d, s, data]),
    // InfluxDB Proxy, when the test wants it: every entity on 18:00-21:00 each day
    callApi: async (method, path) => {
      if (!proxy) { const e = new Error("not found"); e.status_code = 404; throw e; }
      proxyCalls.push(path);
      const q = new URLSearchParams(path.split("?")[1] || "");
      const ents = (q.get("entities") || "").split(",").filter(Boolean);
      const a = Number(q.get("start") || Date.now() - 864e5), b = Number(q.get("end") || Date.now()), out = {};
      for (const id of ents) {
        if (path.startsWith("influx_proxy/series")) { out[id] = []; for (let t = a; t < b; t += 3600e3) out[id].push({ start: t, end: t, mean: 21.5, min: 21, max: 22 }); continue; }
        const rows = [[a - 1000, "off", null, null]];
        for (let t = a - (a % 864e5); t < b; t += 864e5) { rows.push([t + 18 * 3600e3, "on", 200, null], [t + 21 * 3600e3, "off", null, null]); }
        out[id] = rows.filter((r) => r[0] < b);
      }
      return out;
    },
    callWS: async (m) => {
      // long-term statistics: daily means 21.7° in the last days, 20.5° before; 1.5 kWh a day on a meter
      if (m.type === "recorder/statistics_during_period") {
        const a = Date.parse(m.start_time), b = Date.parse(m.end_time), recent = b > Date.now() - 864e5, out = {};
        for (const id of m.statistic_ids) {
          out[id] = [];
          for (let t = a; t < b; t += 864e5) out[id].push({ start: t, end: t + 864e5, mean: recent ? 21.7 : 20.5, change: recent ? 1.5 : 1.0 });
        }
        return out;
      }
      if (m.type !== "history/history_during_period") return {};
      // every entity on for (1..5) hours each day of the range
      const a = Date.parse(m.start_time) / 1000, b = Date.parse(m.end_time) / 1000, out = {};
      m.entity_ids.forEach((id, i) => {
        const rows = [{ s: "off", lu: a }];
        for (let t = a; t < b; t += 86400) { rows.push({ s: "on", lu: t + 18 * 3600 }, { s: "off", lu: t + 18 * 3600 + 3600 * ((i % 5) + 1) }); }
        out[id] = rows.filter((r) => r.lu < b);
      });
      return out;
    } };
}

async function mount(config, hass, width) {
  const el = document.createElement("living-floorplan-card");
  if (width) el.style.width = width + "px";
  el.setConfig({ type: "custom:living-floorplan-card", model: MODEL, ...config });
  document.getElementById("stage").appendChild(el);
  el.hass = hass;
  for (let i = 0; i < 100 && !el.shadowRoot.querySelector("svg"); i++) await tick();
  await tick(150);
  return el;
}

if (shot) {
  document.getElementById("results").remove();
  const mode = shot === "day" ? "day" : "night";
  const maps = { temperature: "temperature", lighthours: "light_hours" };
  if (shot === "onboarding") {
    const e = document.createElement("living-floorplan-card");
    e.style.width = "600px";
    e.setConfig({ type: "custom:living-floorplan-card" });
    document.getElementById("stage").appendChild(e);
    e.hass = fakeHass("night", P.get("lang") || "en");
    await tick(300);
  } else if (shot === "sun") {
    // the example faces south at the top of the plan; Bielsko-Biała, 17 October 14:00
    const h = fakeHass("dark");
    h.config = { latitude: 49.82, longitude: 19.04, time_zone: "Europe/Warsaw" };
    const RD = Date;
    const fixed = Date.parse(P.get("at") || "2026-10-17T12:00:00Z");
    globalThis.Date = class extends RD { constructor(...a) { super(...(a.length ? a : [fixed])); } static now() { return fixed; } };
    await mount({ sun: P.get("offset") ? { offset: Number(P.get("offset")) } : true }, h, 1000);
    await tick(400);
  } else if (shot === "light") {
    const h = fakeHass("night");
    await mount({ theme: "light", doors: "open" }, h, 1000);
    await tick(400);
  } else if (shot === "camera") {
    const h = fakeHass("night");
    h.states["binary_sensor.front_door_person"] = { entity_id: "binary_sensor.front_door_person", state: "off", attributes: {}, last_updated: "0" };
    const e = await mount({ camera_popup: "always" }, h, 1000);
    e.hass = { ...h, states: { ...h.states, "binary_sensor.front_door_person": { entity_id: "binary_sensor.front_door_person", state: "on", attributes: {}, last_updated: "1" } } };
    await tick(400);
  } else if (shot === "travel") {
    const e = await mount({}, fakeHass("day"), 1000);
    e.shadowRoot.getElementById("tt-btn").click();
    await tick(400);
    const sl = e.shadowRoot.getElementById("tt-slider");
    sl.value = String(Math.round((19.2 / 24) * 1000)); sl.dispatchEvent(new Event("input"));
    await tick(300);
  } else if (shot === "gif") {
    // the GIF itself, as base64 in <pre id="gif"> (tools: dump the DOM, decode)
    const e = await mount({}, fakeHass("day"), 1000);
    e.shadowRoot.getElementById("tt-btn").click();
    await tick(400);
    await e._recordDay(Number(P.get("frames") || 24));
    const b = new Uint8Array(await e._lastGif.blob.arrayBuffer());
    let bin = ""; for (let i = 0; i < b.length; i += 32768) bin += String.fromCharCode(...b.subarray(i, i + 32768));
    const pre = document.createElement("pre"); pre.id = "gif"; pre.textContent = btoa(bin); document.body.appendChild(pre);
  } else if (shot === "alerts") {
    const h = fakeHass("night");
    for (const [id, st] of [["binary_sensor.hall_smoke", "on"], ["binary_sensor.living_room_window", "on"], ["sensor.outside_temperature", "3"]])
      h.states[id] = { entity_id: id, state: st, attributes: {}, last_updated: "x" };
    await mount({ cold: { outside: "sensor.outside_temperature" } }, h, 1000);
    await tick(400);
  } else {
  const el = await mount({ light: shot === "glow" ? "glow" : "realistic", floor: shot === "upstairs" ? "first-floor" : null,
    rotate: shot === "phone" ? "auto" : 0, map: maps[shot], doors: shot === "night" || shot === "phone" ? "open" : undefined }, fakeHass(mode, P.get("lang") || "en"), shot === "phone" ? null : 1000);
  await tick(400);
  void el;
  }
} else {
  const hass = fakeHass("night");
  const el = await mount({ doors: "open" }, hass, 900);
  const sr = el.shadowRoot, svg = sr.querySelector("svg");
  check("plan drawn", !!svg && svg.querySelectorAll("#rooms polygon").length >= 5, svg && svg.querySelectorAll("#rooms polygon").length);
  const field = svg.querySelector("#light-field");
  check("light field inserted under the lamps", field && field.nextElementSibling && field.nextElementSibling.id === "lights");
  const lf = [...svg.querySelectorAll("[data-lf]")];
  check("a light-field group per light entity", lf.length >= 8, lf.length);
  const onIds = Object.values(hass.states).filter((s) => s.entity_id.startsWith("light.") && s.state === "on").map((s) => s.entity_id);
  const opOn = lf.filter((g) => onIds.includes(g.dataset.lf)).map((g) => Number(g.style.opacity));
  const opOff = lf.filter((g) => !onIds.includes(g.dataset.lf)).map((g) => Number(g.style.opacity));
  check("lit lamps light their rooms", opOn.length && opOn.every((o) => o > 0.2), opOn.join(","));
  check("dark lamps do not", opOff.every((o) => o === 0), opOff.join(","));
  const dimmed = Object.values(hass.states).find((s) => s.attributes.brightness === 90);
  const g = dimmed && lf.find((x) => x.dataset.lf === dimmed.entity_id);
  check("a dimmed lamp is dimmer", !g || (Number(g.style.opacity) > 0.2 && Number(g.style.opacity) < 0.6), g && g.style.opacity);
  check("round glows of lamps hidden in realistic mode", getComputedStyle(svg.querySelector(".light .glow") || svg).display === "none" || !svg.querySelector(".light .glow"));
  const dg = svg.querySelector(".icon-device .glow");
  check("device glows (appliances, alarms) stay in realistic mode", !dg || getComputedStyle(dg).display !== "none");
  const temps = [...svg.querySelectorAll(".climate-temp")].map((t) => t.textContent);
  check("room readings filled", temps.length && temps.every((t) => /°$/.test(t)), temps.join(" "));
  const covered = svg.querySelectorAll(".cover." + "covered");
  check("closed covers drawn as closed", covered.length >= 1, covered.length);
  const floors = [...sr.querySelectorAll("#floors button")].map((b) => b.textContent);
  check("floor switcher lists both floors", floors.length === 2, floors.join("|"));

  // tap a lamp -> toggle; hold -> more-info
  const lamp = svg.querySelector('.light[data-entity] use');
  const r = lamp.getBoundingClientRect();
  const id = lamp.closest("[data-entity]").getAttribute("data-entity");
  const wrap = sr.getElementById("wrap");
  const ev = (type, x, y, pid = 1) => wrap.dispatchEvent(new PointerEvent(type, { clientX: x, clientY: y, pointerId: pid, bubbles: true }));
  ev("pointerdown", r.left + r.width / 2, r.top + r.height / 2); ev("pointerup", r.left + r.width / 2, r.top + r.height / 2);
  check("tap on a lamp toggles it", calls.length === 1 && calls[0][1] === "toggle" && calls[0][2].entity_id === id, JSON.stringify(calls));
  let info = null;
  el.addEventListener("hass-more-info", (e) => { info = e.detail.entityId; });
  ev("pointerdown", r.left + r.width / 2 + 10, r.top + r.height / 2);
  await tick(650);
  ev("pointerup", r.left + r.width / 2 + 10, r.top + r.height / 2);
  check("hold opens the entity dialog (finger 10 px off)", info === id, info);
  check("hold does not toggle", calls.length === 1, calls.length);
  // tap on a room's empty floor -> the room's window
  {
    const poly = svg.querySelector("#rooms polygon#room-room1") || [...svg.querySelectorAll("#rooms polygon[id^='room-']")].find((p) => el._roomContents(p.id.slice(5)).covers.length);
    const rid = poly && poly.id.slice(5);
    const pr = poly.getBoundingClientRect();
    let spot = null;
    for (let fy = 0.1; fy < 0.95 && !spot; fy += 0.05) for (let fx = 0.1; fx < 0.95 && !spot; fx += 0.05) {
      const x = pr.left + pr.width * fx, y = pr.top + pr.height * fy;
      if (el._roomAtPoint(x, y) === rid && !el._hit(x, y) && !el._widgetAt(x, y)) spot = [x, y];
    }
    const n0 = calls.length;
    ev("pointerdown", spot[0], spot[1]); ev("pointerup", spot[0], spot[1]);
    const box = sr.getElementById("fc-room");
    check("tap on a room's empty floor opens its window", box && !box.hidden && sr.querySelector("#fc-room .t").textContent.length > 0, spot && spot.join(","));
    check("... without toggling anything", calls.length === n0, calls.length - n0);
    const c = el._roomContents(rid);
    check("room window lists its lights and covers", sr.querySelectorAll("#fc-room [data-light]").length === c.lights.length && sr.querySelectorAll("#fc-room .cov").length === c.covers.length && c.covers.length > 0,
      c.lights.length + "/" + c.covers.length);
    const down = sr.querySelector("#fc-room .cov button[data-cmd='close_cover']");
    down.click();
    check("room window: ▼ closes that cover", calls.length === n0 + 1 && calls[n0][1] === "close_cover" && calls[n0][2].entity_id === c.covers[0], JSON.stringify(calls[n0]));
    const lb = sr.querySelector("#fc-room [data-light]");
    if (lb) { lb.click(); check("room window: a light chip toggles it", calls[calls.length - 1][1] === "toggle" && calls[calls.length - 1][2].entity_id === lb.dataset.light); }
    const pos = sr.querySelector("#fc-room .cov .p").textContent;
    check("room window: cover position shown", /%$|closed|open/.test(pos), pos);
    sr.getElementById("fc-room-x").click();
    check("room window closes", box.hidden);
    {
      const h0 = el._hass, lid = c.lights[0] || id;
      el._hass = { ...h0, states: { ...h0.states, [lid]: { ...h0.states[lid], attributes: { friendly_name: "Box 12 Lamp over the table" } } },
        entities: { [lid]: { device_id: "d1" } }, devices: { d1: { name: "Box 12" } } };
      check("room window: names without the device in front", el._shortName(lid) === "Lamp over the table", el._shortName(lid));
      el._hass = h0;
    }
    calls.length = n0; // the checks below count from here
  }
  // notes: text, markers, arrows from the model; a marker's tap shows its note
  {
    check("notes drawn: text, two markers, an arrow", svg.querySelectorAll("#notes .note-text").length === 1 && svg.querySelectorAll("#notes .note-marker").length === 2 &&
      svg.querySelectorAll("#notes .note-arrow").length === 1, svg.querySelectorAll("#notes > *").length);
    const pin = svg.querySelector("#marker-valve .note-pin").getBoundingClientRect(), n1 = calls.length;
    const cx = pin.left + pin.width / 2, cy = pin.top + pin.height / 2;
    ev("pointerdown", cx, cy); ev("pointerup", cx, cy);
    const nb = sr.getElementById("fc-note");
    check("tap on a marker shows its caption and note", !nb.hidden && /Water valve/.test(nb.textContent) && /clockwise/.test(nb.textContent), nb.textContent);
    check("... and runs nothing", calls.length === n1 && sr.getElementById("fc-room").hidden);
    ev("pointerdown", cx + 200, cy + 200); ev("pointerup", cx + 200, cy + 200);
    check("a tap elsewhere hides the note", nb.hidden);
    el._closeRoom(); calls.length = n1;
  }
  // the lasso: draw round a room, then switch its lights and covers
  {
    const room = svg.querySelector("#room-living").getBoundingClientRect(), n2 = calls.length;
    // round the room with a margin: the covers sit on the windows' outer face
    const ring = [[room.left - 14, room.top - 14], [room.right + 14, room.top - 14], [room.right + 14, room.bottom + 14], [room.left - 14, room.bottom + 14], [room.left - 14, room.top - 10]];
    const drawRing = (shift) => {
      const [x0, y0] = ring[0];
      wrap.dispatchEvent(new PointerEvent("pointerdown", { clientX: x0, clientY: y0, pointerId: 31, bubbles: true, shiftKey: shift }));
      for (let i = 1; i < ring.length; i++) for (let k = 1; k <= 8; k++) {
        const [xa, ya] = ring[i - 1], [xb, yb] = ring[i];
        wrap.dispatchEvent(new PointerEvent("pointermove", { clientX: xa + (xb - xa) * k / 8, clientY: ya + (yb - ya) * k / 8, pointerId: 31, bubbles: true }));
      }
      const [xe, ye] = ring[ring.length - 1];
      wrap.dispatchEvent(new PointerEvent("pointerup", { clientX: xe, clientY: ye, pointerId: 31, bubbles: true }));
    };
    const vb0 = svg.getAttribute("viewBox");
    const lb = sr.getElementById("lasso-btn");
    check("lasso: a button next to the zoom", !!lb);
    if (lb) lb.click();
    drawRing(false);
    const bar = sr.getElementById("fc-lasso-bar");
    check("lasso: drawing round the living room selects its lights and covers", !bar.hidden && /\d+ lights · [1-9]\d* covers/.test(bar.textContent) &&
      sr.querySelectorAll("#fc-lasso .dots circle").length >= 3, bar.textContent);
    check("lasso: the plan did not pan and nothing was switched yet", svg.getAttribute("viewBox") === vb0 && calls.length === n2);
    const offB = bar.querySelector("[data-l=off]");
    if (offB) offB.click();
    const c0 = calls[n2];
    check("lasso: Turn off sends all the selected lights at once", c0 && c0[0] === "homeassistant" && c0[1] === "turn_off" && c0[2].entity_id.length >= 1 &&
      c0[2].entity_id.every((e) => /^(light|switch)\./.test(e)), JSON.stringify(c0));
    check("lasso: done after the action", bar.hidden && sr.getElementById("fc-lasso").hidden && !sr.getElementById("lasso-btn").classList.contains("on"));
    drawRing(true);
    check("lasso: Shift + drag works without the button", !bar.hidden);
    const downB = bar.querySelector("[data-l=down]");
    if (downB) downB.click();
    check("lasso: ▼ closes the selected covers and keeps the selection", calls[calls.length - 1][1] === "close_cover" && !bar.hidden);
    const [tx, ty] = [room.left + room.width / 2, room.top + room.height / 2];
    ev("pointerdown", tx, ty); ev("pointerup", tx, ty);
    check("lasso: a tap elsewhere ends the selection (and opens nothing)", bar.hidden && sr.getElementById("fc-room").hidden);
    calls.length = n2;
  }
  // drag pans, does not toggle
  const vb0 = svg.getAttribute("viewBox");
  sr.querySelector("#zoom button").click();
  const vb1 = svg.getAttribute("viewBox");
  check("zoom button zooms", vb1 !== vb0, vb1);
  // zoom out below the whole plan, down to 0.5x, the plan in the middle
  {
    const zb = [...sr.querySelectorAll("#zoom button")];
    zb[2].click(); const full = svg.getAttribute("viewBox").split(" ").map(Number);
    for (let i = 0; i < 4; i++) zb[1].click();
    const out = svg.getAttribute("viewBox").split(" ").map(Number);
    check("zoom out to half: the whole plan smaller, in the middle", Math.abs(out[2] / full[2] - 2) < 0.01 && Math.abs((out[0] + out[2] / 2) - (full[0] + full[2] / 2)) < 0.5, out.join(" "));
    zb[2].click(); zb[0].click();
  }
  ev("pointerdown", 300, 200, 2); ev("pointermove", 340, 230, 2); ev("pointermove", 380, 260, 2); ev("pointerup", 380, 260, 2);
  check("drag pans the plan", svg.getAttribute("viewBox") !== vb1, svg.getAttribute("viewBox"));
  check("drag does not toggle", calls.length === 1, calls.length);
  // a closed door with a contact sensor blocks light: count lit area before / after is hard - check the layer rebuilds
  // a closed door with a contact sensor stops the light: the bathroom door
  const pathsOf = (svgEl) => [...svgEl.querySelectorAll("[data-lf] path")].map((p) => p.getAttribute("d")).join("|");
  const h2 = { ...hass, states: { ...hass.states } };
  h2.states["binary_sensor.bathroom_door"] = { entity_id: "binary_sensor.bathroom_door", state: "on", attributes: {}, last_updated: "open" };
  el.hass = h2; await tick(50);
  const open = pathsOf(svg);
  h2.states = { ...h2.states, "binary_sensor.bathroom_door": { entity_id: "binary_sensor.bathroom_door", state: "off", attributes: {}, last_updated: "closed" } };
  el.hass = { ...h2 }; await tick(50);
  const closed = pathsOf(svg);
  check("closing a door with a contact changes the light (rebuilt with the door as a wall)", open && closed && open !== closed, (open === closed) + "");
  // upstairs

    btn0.click();
    check("widgets: a bar button runs its scene", calls.length === n8 + 1 && calls[n8][0] === "scene", JSON.stringify(calls[n8]));
    eb3.hass = { ...hw, states: { ...hw.states, "weather.home": { ...hw.states["weather.home"], last_updated: "z", attributes: { temperature: 9 } } } }; await tick(50);
    check("widgets: live updates keep the bar's nodes", eb3.shadowRoot.querySelectorAll("#fc-bar .fc-chip")[2] === btn0);
    hw.states["sensor.waste_next"] = { entity_id: "sensor.waste_next", state: "2026-11-06", attributes: { friendly_name: "Waste", info: "Fri 6.11: sorted (plastic, metal, paper, glass), mixed and garden waste" }, last_updated: "w" };
    const eLong = await mount({ widgets: [{ type: "state", entity: "sensor.waste_next", attribute: "info", name: "Waste" }] }, hw, 360);
    const bar = eLong.shadowRoot.getElementById("fc-bar"), lc = bar.querySelector(".fc-chip");
    check("widgets: a long text wraps inside a narrow card", lc.getBoundingClientRect().right <= bar.getBoundingClientRect().right + 0.5 && lc.getBoundingClientRect().height > 45,
      Math.round(lc.getBoundingClientRect().right) + "/" + Math.round(bar.getBoundingClientRect().right));
    const e90 = await mount({ rotate: 90, widgets: [{ type: "clock", at: [10, 8] }] }, hw, 380);
    const tr = e90.shadowRoot.querySelector("#fc-widgets [data-w]").getAttribute("transform");
    check("widgets: upright on a turned plan (no rotation)", /^translate\(/.test(tr) && !/rotate/.test(tr), tr);
  }

  // review 26.10: readings do not glow, the legend's chips survive live updates, the banner after a new config
  {
    const er2 = await mount({}, fakeHass("night"), 900);
    const on = (id) => er2.shadowRoot.querySelector(`[data-entity="${id}"]`).classList.contains("on");
    check("review: a battery or solar reading is not 'on'", !on("sensor.home_battery") && !on("sensor.solar_power"));
    er2.shadowRoot.getElementById("layer-btn").click(); [...er2.shadowRoot.querySelectorAll("#layer-menu button")][1].click(); await tick(100);
    const chip0 = er2.shadowRoot.querySelector("#legend .periods button");
    er2.hass = { ...er2._hass, states: { ...er2._hass.states, "sensor.living_temperature": { entity_id: "sensor.living_temperature", state: "22.9", attributes: {}, last_updated: "new" } } };
    await tick(50);
    check("review: a live update keeps the period chips (same nodes)", chip0 && er2.shadowRoot.querySelector("#legend .periods button") === chip0);
    const ha3 = fakeHass("night");
    ha3.states["binary_sensor.hall_smoke"] = { entity_id: "binary_sensor.hall_smoke", state: "on", attributes: {}, last_updated: "x" };
    const eb2 = await mount({}, ha3, 700);
    eb2.setConfig({ type: "custom:living-floorplan-card", model: MODEL, show_room_names: true }); eb2.hass = ha3; await tick(300);
    check("review: the alarm banner is back after a new config", eb2.shadowRoot.querySelectorAll("#alerts button").length >= 1);
  }

  {
    const ev3 = await mount({ show_version: true }, fakeHass("night"), 600);
    const lab = ev3.shadowRoot.getElementById("fc-version");
    check("show_version: the version label in the corner", lab && !lab.hidden && /^0\.\d+\.\d+/.test(lab.textContent), lab && lab.textContent);
    const ev4 = await mount({}, fakeHass("night"), 600);
    check("show_version: hidden by default", ev4.shadowRoot.getElementById("fc-version").hidden);
  }

  // a lamp left on in an empty room
  {
    const hf2 = fakeHass("night");
    const ef2 = await mount({}, hf2, 900);
    const src = ef2._floorsLowered[0].sources.living;
    const old = new Date(Date.now() - 2 * 3600e3).toISOString(), fresh = new Date(Date.now() - 60e3).toISOString();
    const st2 = { ...hf2.states };
    for (const id of src.presence) st2[id] = { entity_id: id, state: "off", attributes: {}, last_changed: old, last_updated: old };
    for (const id of src.lights) st2[id] = { entity_id: id, state: "off", attributes: {}, last_changed: old, last_updated: old };
    st2[src.lights[0]] = { entity_id: src.lights[0], state: "on", attributes: {}, last_changed: old, last_updated: old };
    ef2.hass = { ...hf2, states: st2 }; await tick(50);
    const nb = [...ef2.shadowRoot.querySelectorAll("#alerts button.nudge")];
    check("forgotten: a lamp on for 2 h in an empty room -> a nudge", nb.length === 1 && /Living room: on, nobody there for 120 min/.test(nb[0].textContent), nb.map((b) => b.textContent).join(" | "));
    check("forgotten: ... and the lamp blinks", !!ef2.shadowRoot.querySelector(`.light.fc-forgotten[data-entity="${src.lights[0]}"]`));
    const n3 = calls.length; nb[0].click();
    check("forgotten: the nudge turns it off", calls.length === n3 + 1 && calls[n3][1] === "turn_off" && calls[n3][2].entity_id.includes(src.lights[0]), JSON.stringify(calls[n3]));
    st2[src.presence[0]] = { ...st2[src.presence[0]], state: "on", last_changed: fresh, last_updated: fresh };
    ef2.hass = { ...hf2, states: { ...st2 } }; await tick(50);
    check("forgotten: someone comes in -> no nudge", !ef2.shadowRoot.querySelectorAll("#alerts button.nudge").length);
  }

  // light and dark
  {
    const ed2 = await mount({ theme: "light" }, fakeHass("night"), 600);
    const room = ed2.shadowRoot.querySelector("#rooms");
    check("theme: light rooms and panel", room.getAttribute("fill") === "#fdfdfe" && /--fc-bg: #f6f8fa/.test(ed2.shadowRoot.getElementById("palette").textContent), room.getAttribute("fill"));
    const ha2 = fakeHass("night"); ha2.themes = { darkMode: false };
    const ea2 = await mount({}, ha2, 600);
    check("theme: auto follows Home Assistant's light mode", ea2.shadowRoot.querySelector("#rooms").getAttribute("fill") === "#fdfdfe");
    ea2.hass = { ...ha2, themes: { darkMode: true } }; await tick(100);
    check("theme: ... and back to dark when HA switches", ea2.shadowRoot.querySelector("#rooms").getAttribute("fill") === "#1e2836");
    // the plan drawn after the first states: the card's colours must follow (bug seen live, 26.10)
    const hl = fakeHass("night"); hl.themes = { darkMode: false };
    const el4 = document.createElement("living-floorplan-card");
    el4.setConfig({ type: "custom:living-floorplan-card", model: MODEL });
    document.getElementById("stage").appendChild(el4);
    el4.hass = hl;
    for (let i = 0; i < 100 && !el4.shadowRoot.querySelector("svg"); i++) await tick();
    await tick(100);
    const tx = el4.shadowRoot.querySelector("#room-climate text");
    check("theme: texts dark on a light plan when the states came before the plan", getComputedStyle(tx).fill === "rgb(43, 52, 66)" &&
      /--fc-bg: #f6f8fa/.test(el4.shadowRoot.getElementById("palette").textContent), getComputedStyle(tx).fill);
    const ac2 = await mount({ accent: "#00bcd4" }, fakeHass("night"), 600);
    check("theme: accent colour", /--fc-accent: #00bcd4/.test(ac2.shadowRoot.getElementById("palette").textContent));
  }

  // Polish
  const el2 = await mount({}, fakeHass("night", "pl"), 600);
  const f2 = [...el2.shadowRoot.querySelectorAll("#floors button")].map((b) => b.textContent);
  check("Polish: the ground floor is 'Parter' unless the model names it", f2[0] === "Parter" || f2[0] === (model.floor_name || ""), f2.join("|"));
  // phone: a wide plan turns
  const el3 = await mount({ rotate: 90 }, fakeHass("night"), 380);
  const vb3 = el3.shadowRoot.querySelector("svg").getAttribute("viewBox").split(" ").map(Number);
  check("rotate: 90 turns the view box", vb3[3] > vb3[2], vb3.join(" "));
  check("turned plan: texts stay upright (turned back by 90)", [...el3.shadowRoot.querySelectorAll("#room-climate text")].every((t) => /rotate\(-90/.test(t.getAttribute("transform") || "rotate(-90")),
    [...el3.shadowRoot.querySelectorAll("#room-climate text")].map((t) => t.getAttribute("transform")).join(" "));

  const ok = results.filter((r) => r.ok).length;
  document.getElementById("results").textContent = results.map((r) => (r.ok ? "PASS  " : "FAIL  ") + r.name + (r.detail ? "  -> " + r.detail : "")).join("\n") +
    "\n" + (ok === results.length ? "OK  " : "FAILED  ") + ok + "/" + results.length + " checks passed";
}
</script>
</body>
</html>
